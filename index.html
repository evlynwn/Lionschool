<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion school</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <nav class="server">

            <div class="logo">
                <img src="./logo-image.svg" alt="logo">
                <span>Lion <br> Server</span>
            </div>

            <div class="sair">
                <img src="./Vector.svg" alt="logoSair">
                <span>Sair</span>
            </div>
        </nav>
    </header>

    <main>
        <div class="main">
            <div class="curso">
                <h1>Escolha um <span class="destaque">curso</span> 
                    <br> para gerenciar.</h1>
                <img src="devices.svg" alt="">
            </div>
            <div class="estudante">
                <img src="./studant.svg" alt="">
            </div>
            <div class="caixas">
                <div class="caix1">
                    <img src="./DS.svg" alt="">
                    <span>DS</span>
                </div>

                <div class="caixa2">
                    <img src="./Vector (1).svg" alt="">
                    <span>REDES</span>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <nav class="contatos">
            <div class="con1">
                <div class="contato">
                    <img src="./telefone.svg" alt="">
                    <p>(11) 4774-4700</p>
                </div>

                <div class="contato">
                    <img src="./icon-email.svg" alt="email">
                    <p>lionschool@gmail.com</p>
                </div>

                <div class="contato">
                    <img src="./Vector (2).svg" alt="endereco">
                    <p> Rua tcc, 211, Centro, Jandira</p>
                </div>
            </div>
       
    
            <div class="Copy">
                <h1>Copyright © 2026 | Fernando Leonid</h1>
            </div>

            <div class="logos">
                <img src="./Group 7.svg" alt="youtuber">
                <img src="./twitter.svg" alt="twitter">
                <img src="./instagram.svg" alt="instagram">
                <img src="./facebook.svg" alt="facebook">
            </div>
        </nav>
    </footer>
    
</body>
</html>
